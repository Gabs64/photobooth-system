<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Birthday Photobooth Memory!</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/share/share.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="share-wrapper">
    <header class="share-header glass-panel">
      <div class="header-brand">
        <div class="brand-icon"><i data-lucide="party-popper"></i></div>
        <div>
          <h1 id="share-event-name">Mia's 10th Birthday Bash!</h1>
          <p id="share-event-date">August 15, 2026</p>
        </div>
      </div>
    </header>

    <main class="share-main">
      <div class="share-card glass-panel">
        <div class="share-card-badge">YOUR PHOTOBOOTH MEMORY</div>

        <div class="photo-preview-container">
          <img id="share-photo-img" src="" alt="Photobooth Memory Sheet">
        </div>

        <div class="share-actions-group">
          <a id="btn-download-hd" href="#" download="photobooth_memory.jpg" class="btn-primary btn-large mb-12">
            <i data-lucide="download"></i> Download Full Resolution Photo
          </a>
          <a id="btn-open-gdrive" href="#" target="_blank" class="btn-secondary btn-large" style="display:none;">
            <i data-lucide="folder"></i> Open Photo Directly in Google Drive
          </a>
        </div>

        <div class="social-share-section">
          <h3>Share with Friends</h3>
          <div class="social-buttons">
            <button id="btn-share-whatsapp" class="btn-secondary btn-social">
              <i data-lucide="message-circle"></i> WhatsApp
            </button>
            <button id="btn-share-native" class="btn-secondary btn-social">
              <i data-lucide="share-2"></i> Share App
            </button>
            <button id="btn-copy-link" class="btn-secondary btn-social">
              <i data-lucide="copy"></i> Copy Link
            </button>
          </div>
        </div>

        <div id="raw-shots-section" class="raw-shots-section">
          <h3>Individual Photo Snapshots</h3>
          <div id="raw-shots-grid" class="raw-shots-grid">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </main>

    <footer class="share-footer">
      <p>Powered by <strong>Birthday Party Photobooth OS</strong></p>
    </footer>
  </div>

  <script src="/js/modal-system.js"></script>
  <script src="/share/share.js"></script>
</body>
</html>
